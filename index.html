<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fullscreen Visual</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="media-container">

    <!-- Optimized video (used on most devices) -->
    <video autoplay muted loop playsinline class="bg-media">
      <source src="assets/gandalf.webm" type="video/webm" />
      <source src="assets/gandalf.mp4" type="video/mp4" />
    </video>

    <!-- GIF fallback (if video fails) -->
    <img src="assets/gandalf.gif" alt="Fallback GIF" class="fallback-gif" />

  </div>
</body>
</html>
